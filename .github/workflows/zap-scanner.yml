```yaml
name: OWASP ZAP Baseline Scan

run-name: ZAP Scan on ${{ inputs.target_url || 'https://owasp.org/www-project-webgoat' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan"
        required: true
        default: "https://owasp.org/www-project-webgoat"

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    name: Execute OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url || 'https://owasp.org/www-project-webgoat' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false
          docker_name: "zaproxy/zap-stable"
          cmd_options: "-r report_html.html -J report_json.json -w report_md.md"

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-vulnerability-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
```

