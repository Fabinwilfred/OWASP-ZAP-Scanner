name: OWASP ZAP Security Runner

run-name: ZAP Scan on ${{ github.event.inputs.target_url || 'Default Target' }}

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Enter Target URL to scan'
        required: true
        default: 'https://staging.example.com'
      scan_type:
        description: 'Scan Profile'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - full

jobs:
  zap_scan:
    name: Execute OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Format Target Label
        id: target_label
        env:
          INPUT_TARGET: ${{ github.event.inputs.target_url }}
        run: |
          # Use default target if input string is empty
          TARGET="${INPUT_TARGET:-https://staging.example.com}"
          CLEAN_LABEL=\((echo "\)TARGET" | sed -e 's/https\?:\/\///' -e 's/[^a-zA-Z0-9]/_/g')
          echo "clean_name=\(CLEAN_LABEL" >> "\)GITHUB_OUTPUT"
          echo "target_uri=\(TARGET" >> "\)GITHUB_OUTPUT"

      - name: Run OWASP ZAP Baseline Scan
        if: ${{ inputs.scan_type == 'baseline' || github.event_name == 'push' }}
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: '${{ steps.target_label.outputs.target_uri }}'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false
          docker_name: 'zaproxy/zap-stable'
          cmd_options: '-r report_html.html -J report_json.json -w report_md.md'

      - name: Run OWASP ZAP Full Scan
        if: ${{ inputs.scan_type == 'full' }}
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: '${{ steps.target_label.outputs.target_uri }}'
          token: ${{ secrets.GITHUB_TOKEN }}
          token_type: 'GITHUB_TOKEN'
          cmd_options: '-r report_html.html -J report_json.json -w report_md.md'

      - name: Publish Report Summary to GitHub UI
        if: always()
        run: |
          echo "## 🛡️ OWASP ZAP Vulnerability Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target Scanned:** \`\({{ steps.target_label.outputs.target_uri }}\`" >> "\)GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "report_md.md" ]; then
            cat report_md.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Markdown report file was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ steps.target_label.outputs.clean_name }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
