name: OWASP ZAP Security Runner

run-name: ZAP Scan on ${{ inputs.target_url || 'https://staging.example.com' }}

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Enter Target URL to scan'
        required: true
        default: 'https://staging.example.com'
      scan_type:
        description: 'Scan Profile'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - full

jobs:
  zap_scan:
    name: Execute OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        if: ${{ inputs.scan_type == 'baseline' || inputs.scan_type == '' }}
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: '${{ inputs.target_url || 'https://staging.example.com' }}'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false
          docker_name: 'zaproxy/zap-stable'
          cmd_options: '-r report_html.html -J report_json.json -w report_md.md'

      - name: Run OWASP ZAP Full Scan
        if: ${{ inputs.scan_type == 'full' }}
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: '${{ inputs.target_url }}'
          token: ${{ secrets.GITHUB_TOKEN }}
          token_type: 'GITHUB_TOKEN'
          cmd_options: '-r report_html.html -J report_json.json -w report_md.md'

      - name: Publish Markdown Summary
        if: always()
        run: |
          echo "## 🛡️ OWASP ZAP Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Target: \({{ inputs.target_url || 'https://staging.example.com' }}" >>\)GITHUB_STEP_SUMMARY
          [ -f report_md.md ] && cat report_md.md >> \(GITHUB_STEP_SUMMARY || echo "No Markdown report produced." >>\)GITHUB_STEP_SUMMARY

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-vulnerability-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
