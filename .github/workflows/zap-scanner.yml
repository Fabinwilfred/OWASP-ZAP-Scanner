name: OWASP ZAP Security Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        default: 'https://owasp.org/www-project-webgoat'
      scan_type:
        description: 'Scan Type (baseline or full)'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - full

jobs:
  zap_scan:
    name: Execute OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan
        if: ${{ inputs.scan_type == 'baseline' || github.event_name == 'push' }}
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: '${{ github.event.inputs.target_url || 'https://staging.example.com' }}'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false

      - name: Run ZAP Full Scan
        if: ${{ inputs.scan_type == 'full' }}
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: '${{ github.event.inputs.target_url }}'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-vulnerability-report
          path: |
            report_html.html
            report_json.json
            report_md.md
